apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-aws-esk-in-tls
  namespace: argocd
spec:
  secretName: argo-aws-esk-in-tls
  duration: 2160h #90day
  renewBefore: 360h #before 15day
  issuerRef:
    name: my-issuer
    kind: ClusterIssuer
  commonName: argo.aws-esk.in
  dnsNames:
    - argo.aws-esk.in
